<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus VPN</title>

    <link rel="stylesheet" href="nexus-vpn.css">
</head>

<body>

    <header class="topbar">
        <div>
            <div class="brand">SHOTOPAPER TECH</div>
            <h1>Nexus VPN</h1>
        </div>

        <div class="version">
            v1.0.0
        </div>
    </header>

    <main class="dashboard">

        <section class="connection-panel">

            <div class="status-label">
                CONNECTION STATUS
            </div>

            <div id="connectionStatus" class="connection-status">
                DISCONNECTED
            </div>

            <button id="connectButton" class="connect-button">
                CONNECT
            </button>

        </section>

        <section class="network-grid">

            <div class="info-card">
                <span>PUBLIC IP</span>
                <strong id="publicIp">Not protected</strong>
            </div>

            <div class="info-card">
                <span>LOCATION</span>
                <strong id="location">Unknown</strong>
            </div>

            <div class="info-card">
                <span>PROTOCOL</span>
                <strong id="protocol">WireGuard</strong>
            </div>

            <div class="info-card">
                <span>LATENCY</span>
                <strong id="latency">--</strong>
            </div>

        </section>

        <section class="server-panel">

            <div class="panel-header">
                <h2>VPN SERVER</h2>
            </div>

            <div class="server-info">

                <div>
                    <span>SERVER</span>
                    <strong id="serverName">No connection</strong>
                </div>

                <div>
                    <span>LOAD</span>
                    <strong id="serverLoad">--</strong>
                </div>

                <div>
                    <span>PACKET LOSS</span>
                    <strong id="packetLoss">--</strong>
                </div>

            </div>

        </section>

        <section class="security-panel">

            <div class="panel-header">
                <h2>PROTECTION</h2>
            </div>

            <div class="security-status">
                <span>SECURITY LAYER</span>
                <strong id="protectionStatus">INACTIVE</strong>
            </div>

        </section>

    </main>

    <footer>
        Nexus VPN · Nexus System
    </footer>

    <script src="core/connection-core.js"></script>
    <script src="core/nexus-wireguard-adapter.js"></script>
    <script src="servers/server-manager.js"></script>
    <script src="servers/health-checker.js"></script>
    <script src="servers/failover-manager.js"></script>
    <script src="security/security-layer.js"></script>
    <script src="monitoring/monitoring-core.js"></script>
    <script src="gateway/gateway-config.js"></script>
    <script src="gateway/gateway-registry.js"></script>
    <script src="identity/device-key-manager.js"></script>
    <script src="core/nexus-runtime.js"></script>
    <script src="nexus-vpn.js"></script>

</body>
</html>
